name: ci
# The full run: a macOS release build plus the static and runtime gates,
# about eight minutes. A push that touches only prose skips it and runs
# docs.yml instead (the two path lists are the same, so every push runs
# exactly one of them); a push that mixes code and prose still runs this.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "llms.txt", "llms-full.txt", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "llms.txt", "llms-full.txt", "LICENSE"]
permissions:
  contents: read
jobs:
  weights-free:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: pinned Metal library
        run: SLOTSTREAM_METALLIB_MACOS=26 Tools/fetch_metallib.sh
      - name: release build
        # `make build` also colocates the pinned metallib with the binary;
        # sampler-golden executes MLX kernels and a bare SwiftPM build does not.
        run: make build
      - name: static and runtime safety gates
        run: Tools/static_gates.sh
      - name: sampler and governor goldens
        run: |
          python3 -m pip install --quiet --break-system-packages numpy
          Tools/sampler_gates.sh
