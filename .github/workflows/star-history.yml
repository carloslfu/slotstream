name: star history

on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: render from GitHub's stargazer timeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Tools/star_history.py \
            --out-light docs/assets/star-history.svg \
            --out-dark docs/assets/star-history-dark.svg
      - name: publish when the chart changed
        run: |
          if git diff --quiet -- docs/assets/star-history.svg docs/assets/star-history-dark.svg; then
            echo "Star history is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history.svg docs/assets/star-history-dark.svg
          git commit -m "chore: update star history [skip ci]"
          git push
