name: docs
# The docs-only run: the gates prose can break are a stale llms-full.txt
# (Tools/llms_full.sh regenerates it from the docs) and the brain under db/
# (Tools/brain_gates.sh: the store validates, MEASUREMENTS.md and PLAN.md
# match their records, every public number has its needle on its surfaces).
# static_gates.sh runs the same checks inside the full build. Under a minute
# on Linux, no toolchain beyond the pinned dbmd binary.
# Path list mirrors ci.yml's paths-ignore so every push runs exactly one.
on:
  pull_request:
    paths: ["**.md", "docs/**", "db/**", "llms.txt", "llms-full.txt", "LICENSE"]
  push:
    branches: [main]
    paths: ["**.md", "docs/**", "db/**", "llms.txt", "llms-full.txt", "LICENSE"]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: llms-full.txt is regenerated from the docs
        run: Tools/llms_full.sh --check
      - name: pinned dbmd
        run: Tools/dbmd_install.sh
      - name: brain gates
        run: Tools/brain_gates.sh
